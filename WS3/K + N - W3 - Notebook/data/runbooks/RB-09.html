<h1>Draining a Kubernetes node</h1>
<h2>Procedure</h2>
<ol><li>Cordon the node: <code>kubectl cordon k8s-wrk-NN</code></li><li>Drain it: <code>kubectl drain k8s-wrk-NN --ignore-daemonsets --delete-emptydir-data</code></li><li>Do the maintenance, then <code>kubectl uncordon k8s-wrk-NN</code>.</li></ol>
