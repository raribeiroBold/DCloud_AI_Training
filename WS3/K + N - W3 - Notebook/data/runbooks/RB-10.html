<h1>Renewing TLS certificates</h1>
<h2>Procedure</h2>
<p>Certificates of the web and API front ends are renewed by the internal ACME client 30 days before they expire. If the renewal fails, the monitoring alert 'certificate expires in less than 14 days' fires: run <code>sudo acme-renew --force</code> on the host and reload nginx.</p>
